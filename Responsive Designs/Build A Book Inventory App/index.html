<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Inventory App</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <h1>Book Inventory</h1>
    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Status</th>
                <th>Rate</th>
            </tr>
        </thead>
        <tbody>
            <tr class="read">
                <td>Harry Potter and The Half-Blood Prince</td>
                <td>J K Rowling</td>
                <td>Fantasy</td>
                <td><span class="status">Read</span></td>
                <td><span class="rate one"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="read">
                <td>Goosebumps</td>
                <td>R. L. Stine</td>
                <td>Horror</td>
                <td><span class="status">Read</span></td>
                <td><span class="rate three"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="in-progress">
                <td>The Jungle Book</td>
                <td>Rudyard Kipling</td>
                <td>Fiction</td>
                <td><span class="status">In Progress</span></td>
                <td><span class="rate"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="to-read">
                <td>Atomic Habits</td>
                <td>-</td>
                <td>Science</td>
                <td><span class="status">To Read</span></td>
                <td><span class="rate"><span></span><span></span><span></span></span></td>
            </tr>
            <tr class="read">
                <td>The Day I Stopped Drinking Milk</td>
                <td>Sudha Murthy</td>
                <td>Storybook</td>
                <td><span class="status">Read</span></td>
                <td><span class="rate two"><span></span><span></span><span></span></span></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
