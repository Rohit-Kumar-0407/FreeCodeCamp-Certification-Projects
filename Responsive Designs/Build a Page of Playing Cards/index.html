<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
  
</head>

<body>
    <style>
    body {
        background-color: aquamarine;
        margin: 1rem;
    }
    #playing-cards {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
    }
    .card {
        display: flex;
        justify-content: space-between;
        background-color: white;
        height: 35rem;
        width: 25rem;
        border: 0.125rem black solid;
        border-radius: 1rem;
        box-shadow: 0.25rem 0.25rem 0.25rem 0.25rem rgba(0,0,0,0.2);
    }
    .left {
        display: flex;
        align-self: flex-start;
        justify-content: left;
        flex-direction: column;
        margin-left: 0.5rem;
    }   
    .middle {
        display: flex;
        justify-content: center;
        align-self: center;
        flex-direction: column;
        flex-wrap: wrap;
    }
    .right {
        display: flex;
        justify-content: start;
        align-self:flex-end;
        flex-direction: column;
        margin-right: 0.5rem;
        transform: rotate(180deg);
    }
    .letter {
        font-size: 2.75rem;
    }
    .symbol {
        font-size: 3.25rem;
    }
    .symbol-center {
        font-size: 8rem;
    }
  </style>
    <main id="playing-cards">
        <div class="card">
            <div class="left">
                <div class="letter">A</div>
                <div class="symbol">♠</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♠</div>
            </div>
            <div class="right">
                <div class="letter">A</div>
                <div class="symbol">♠</div>
            </div>
        </div>
        <div class="card" style="color: red;">
            <div class="left">
                <div class="letter">4</div>
                <div class="symbol">♥</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♥♥</div>
                <div class="symbol-center" style="transform: rotate(180deg);">♥♥</div>
            </div>
            <div class="right">
                <div class="letter">4</div>
                <div class="symbol">♥</div>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <div class="letter">2</div>
                <div class="symbol">♣</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♣</div>
                <div class="symbol-center" style="transform: rotate(180deg);">♣</div>
            </div>
            <div class="right">
                <div class="letter">2</div>
                <div class="symbol">♣</div>
            </div>
        </div>
        <div class="card" style="color: red;">
            <div class="left">
                <div class="letter">3</div>
                <div class="symbol">♦</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♦</div>
                <div class="symbol-center">♦</div>
                <div class="symbol-center">♦</div>
            </div>
            <div class="right">
                <div class="letter">3</div>
                <div class="symbol">♦</div>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <div class="letter">Q</div>
                <div class="symbol">♣</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♣</div>
            </div>
            <div class="right">
                <div class="letter">Q</div>
                <div class="symbol">♣</div>
            </div>
        </div>
        <div class="card" style="color: red;">
            <div class="left">
                <div class="letter">K</div>
                <div class="symbol">♥</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♥</div>
            </div>
            <div class="right">
                <div class="letter">K</div>
                <div class="symbol">♥</div>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <div class="letter">5</div>
                <div class="symbol">♠</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♠♠</div>
                <div class="symbol-center">♠</div>
                <div class="symbol-center" style="transform: rotate(180deg);">♠♠</div>
            </div>
            <div class="right">
                <div class="letter">5</div>
                <div class="symbol">♠</div>
            </div>
        </div>
        <div class="card" style="color: red;"   >
            <div class="left">
                <div class="letter">J</div>
                <div class="symbol">♦</div>
            </div>
            <div class="middle">
                <div class="symbol-center">♦</div>
            </div>
            <div class="right">
                <div class="letter">J</div>
                <div class="symbol">♦</div>
            </div>
        </div>
</body>

</html>
