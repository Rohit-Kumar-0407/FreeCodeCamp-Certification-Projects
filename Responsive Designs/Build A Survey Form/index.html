<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
  </head>

  <body>
    <h1 id="title">TaskIt Survey Form</h1>
    <p id="description">Thank you for using TaskIt. We would like to hear from you how was your experience with TaskIt!</p>
    <form id="survey-form">

        <label id="name-label">1) Enter Name: </label><input type="text" id="name" placeholder="Enter your Name" required>
        <br><br>

        <label id="email-label">2) Enter Email: </label><input type="email" id="email" placeholder="Enter your Email" required>
        <br><br>

        <label id="number-label">3) Enter Mobile Number: </label><input type="number" id="number" placeholder="Enter your Mobile Number" min="1" max="10">
        <br><br>

        <label id="age-label">4) Enter Age: </label><input type="number" id="age" placeholder="Enter your Age" min="2" max="2">
        

        <p id="Q1">5) What's your Profession ?</p>
        <select name="select-option" id="dropdown">
            <option value="Select Profession" selected>Select Profession</option>
            <option value="Student" >Student</option>
            <option value="Working Professional">Working Professional</option>
            <option value="Prefer Not To Say">Prefer Not To Say</option>
        </select>

        <p id="reccomendation">6) Would you like to recommend TaskIt to your family and friends?</p>
        <input type="radio" value="Definitely Yes" name="radio-option"><label value="Definitely Yes">Definitely Yes</label>
        <input type="radio" value="Neutral" name="radio-option"><label value="Neutral">Neutral</label>
        <input type="radio" value="Product Needs Improvement" name="radio-option"><label value="Product Needs Improvement">Product Needs Improvement</label-for>
        
        <p id="features-liked">7) What are the features which you liked in TaskIt?</p>
        <input type="checkbox" value="Designer UI"><label-for value="Designer UI">Designer UI</label-for>
        <input type="checkbox" value="Notification Reminders"><label-for value="Notification Reminders">Notification Reminders</label-for>
        <input type="checkbox" value="Gamification Of Tasks"><label-for value="Gamification Of Tasks">Gamification Of Tasks</label-for>
        <input type="checkbox" value="App Productivity"><label-for value="App Productivity">App Productivity</label-for>
        <input type="checkbox" value="None Of The Above"><label-for value="None Of The Above">None Of The Above</label-for>

        <p id="Feedback">8) Anything you would like us to know ? (Suggestions/Feedback)</p>
        <textarea name="feedback" id="feedback" placeholder="Please provide your feedback..." rows="5" cols="30"></textarea><br>

        <button id="submit">Submit Feedback</button>
    </form>
  </body>
</html>
